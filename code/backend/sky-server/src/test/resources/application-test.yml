spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:takeout;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
  main:
    allow-bean-definition-overriding: false
logging:
  level:
    root: warn
    com.sky: info

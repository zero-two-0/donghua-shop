<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bgs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9d0" />
      <stop offset="1" stop-color="#f2a95c" />
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4a2c" />
      <stop offset="1" stop-color="#3f2a18" />
    </linearGradient>
    <radialGradient id="bowl" cx="0.5" cy="0.38" r="0.66">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f3e3cd" />
    </radialGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f1ece2" />
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#bgs)" />
  <ellipse cx="240" cy="272" rx="218" ry="26" fill="#a9691f" opacity="0.16" />

  <!-- 托盘 -->
  <rect x="30" y="150" width="420" height="118" rx="26" fill="#a9713f" opacity="0.25" />
  <rect x="30" y="140" width="420" height="118" rx="26" fill="#8b5a30" />
  <rect x="42" y="150" width="396" height="98" rx="18" fill="#a3703f" />

  <!-- 左盘：主食 -->
  <ellipse cx="140" cy="182" rx="86" ry="52" fill="#000" opacity="0.12" />
  <ellipse cx="140" cy="176" rx="86" ry="52" fill="url(#bowl)" />
  <ellipse cx="140" cy="174" rx="78" ry="46" fill="url(#rice)" />
  <g fill="#ffffff">
    <circle cx="112" cy="164" r="8" />
    <circle cx="134" cy="156" r="9" />
    <circle cx="158" cy="164" r="8" />
    <circle cx="170" cy="180" r="7" />
    <circle cx="124" cy="186" r="8" />
    <circle cx="148" cy="188" r="8" />
    <circle cx="140" cy="172" r="9" />
  </g>
  <g fill="#3f7a2c">
    <circle cx="140" cy="152" r="4" />
    <circle cx="166" cy="176" r="3.6" />
  </g>

  <!-- 右盘：两样菜 -->
  <ellipse cx="330" cy="182" rx="92" ry="55" fill="#000" opacity="0.12" />
  <ellipse cx="330" cy="176" rx="92" ry="55" fill="url(#bowl)" />
  <ellipse cx="330" cy="176" rx="76" ry="44" fill="#fffaf1" />

  <g>
    <rect x="286" y="152" width="30" height="26" rx="8" fill="#b96a24" transform="rotate(-8 301 165)" />
    <rect x="318" y="146" width="32" height="28" rx="8" fill="#c9762f" transform="rotate(6 334 160)" />
    <rect x="304" y="176" width="30" height="26" rx="8" fill="#9c5218" transform="rotate(3 319 189)" />
    <circle cx="352" cy="178" r="7" fill="#eec27a" />
    <circle cx="292" cy="186" r="6" fill="#eec27a" />
    <rect x="336" y="164" width="20" height="6" rx="3" fill="#d2402c" transform="rotate(-20 346 167)" />
    <rect x="298" y="140" width="18" height="6" rx="3" fill="#4f9e3f" transform="rotate(24 307 143)" />
  </g>

  <!-- 小碗汤 -->
  <ellipse cx="392" cy="126" rx="46" ry="27" fill="#000" opacity="0.10" />
  <ellipse cx="392" cy="120" rx="46" ry="27" fill="url(#bowl)" />
  <ellipse cx="392" cy="120" rx="34" ry="18" fill="#f6d9a8" />
  <g fill="#7fb069" opacity="0.9">
    <circle cx="384" cy="116" r="4" />
    <circle cx="400" cy="122" r="3.6" />
  </g>

  <!-- 筷子 -->
  <g stroke="#7a4a22" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="286" x2="300" y2="252" />
    <line x1="72" y1="296" x2="306" y2="266" />
  </g>
</svg>

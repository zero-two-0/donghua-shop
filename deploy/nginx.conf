# 东华大学在线点餐系统 · Nginx 部署配置模板（第 8 周部署阶段使用）
#
# 说明：
#   1) 两个前端都是 SPA（hash 路由），静态托管即可，不需要 history 回退；
#   2) 后端（Spring Boot 8080）未开启 CORS，因此 /user、/admin、/assets 必须由 Nginx 同源反代；
#   3) 本机尚未安装 Nginx，本文件是部署阶段的配置基线，未做真实验收；
#      当前等价验证用 scripts/serve-dist.mjs（规则一致）。
#
# 使用方式：
#   把 dist 产物放到 /var/www/donghua-shop/{user-h5,admin-web}，将本文件放入 nginx conf.d/ 后 reload。

# ---------- 用户端 H5 ----------
server {
    listen       8081;
    server_name  _;

    root  /var/www/donghua-shop/user-h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口与静态资源（菜品图片 /assets/*.svg、契约 /openapi.yaml）
    # 后端接口（同源反代，避免 CORS）
    location ~ ^/(user|admin)/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        client_max_body_size 10m;
    }

    # 后端静态资源：只有 /assets/*.svg（菜品图）在 8080，必须精确按扩展名反代；
    # 前端 Vite 产物同样在 /assets/ 下（*.js / *.css），不能一起转发，否则入口 JS 404。
    location ~ ^/assets/.+\.svg$ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
    }

    location = /openapi.yaml {
        proxy_pass         http://127.0.0.1:8080/openapi.yaml;
    }

    location = /doc.html {
        proxy_pass         http://127.0.0.1:8080/doc.html;
    }

    # 静态资源缓存（Vite 产物带 hash）
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# ---------- 商家管理 Web ----------
server {
    listen       8082;
    server_name  _;

    root  /var/www/donghua-shop/admin-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口（同源反代，避免 CORS）
    location ~ ^/(user|admin)/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        client_max_body_size 10m;
    }

    # 后端静态资源：只有 /assets/*.svg（菜品图）在 8080，必须精确按扩展名反代；
    # 前端 Vite 产物同样在 /assets/ 下（*.js / *.css），不能一起转发，否则入口 JS 404。
    location ~ ^/assets/.+\.svg$ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
    }

    location = /openapi.yaml {
        proxy_pass         http://127.0.0.1:8080/openapi.yaml;
    }

    location = /doc.html {
        proxy_pass         http://127.0.0.1:8080/doc.html;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

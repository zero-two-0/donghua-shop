openapi: 3.0.3
info:
  title: 东华大学在线点餐系统课程版接口契约
  version: 1.0.0-draft
  description: 负责人：刘晟玺。Bearer JWT；管理端与用户端令牌不可混用。接口批次：认证与浏览、购物车与地址、订单、管理端。完整结构用于前后端并行开发，待钱文博真实评审确认；不声称已签字冻结。响应使用code/msg/data，code=1成功、0失败，业务拒绝可返回HTTP200。主键Java
    Long当前JSON数字；前端避免生成超出JS安全整数范围的ID。LocalDateTime统一yyyy-MM-dd HH:mm:ss。 营业状态暂存内存，启动默认营业，重启恢复默认；HTTP409表示唯一键或数据完整性冲突。
servers:
- url: http://localhost:8080
  description: 本地课程环境
security:
- BearerAuth: []
paths:
  /admin/employee/login:
    post:
      tags:
      - 管理端employee
      summary: 员工登录
      operationId: post_admin_employee_login
      responses:
        '200':
          description: 成功code=1；业务拒绝可能HTTP200且code=0，前端必须同时判断code。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EmployeeLoginVOResult'
                - $ref: '#/components/schemas/ErrorResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeLoginDTO'
  /admin/employee/logout:

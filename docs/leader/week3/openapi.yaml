        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Unauthorized:
      description: JWT缺失、失效或身份不匹配
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Conflict:
      description: 数据库唯一键或数据完整性冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    InternalError:
      description: 服务器内部错误，响应不应暴露堆栈或敏感信息

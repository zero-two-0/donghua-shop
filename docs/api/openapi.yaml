        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录接口返回的令牌，后续请求放入 Authorization: Bearer <token> 请求头。'

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 每页条数，最大 50
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    DishId:
      name: dishId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SetmealId:
      name: setmealId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 参数校验失败（40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40001
            message: 参数校验失败
            data: null
            errors:
              - field: phone
                message: 手机号格式不正确
    Unauthorized:
      description: 未登录或令牌失效（40101）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40101
            message: 登录已过期，请重新登录
            data: null
    NotFound:
      description: 资源不存在（40401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: 40401
            message: 资源不存在
            data: null

  schemas:
    ApiOk:
      type: object
      description: 成功响应外壳
      required: [code, message]
      properties:
        code:
          type: integer
          enum: [0]
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
          description: 业务数据，具体结构见各接口

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 40001
        message:
          type: string
          example: 参数校验失败
        data:
          nullable: true
          example: null
        errors:
          type: array
          description: 仅在参数校验失败时返回
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PageResult:
      type: object
      required: [page, pageSize, total, records]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          example: 17
        records:
          type: array
          items: {}

    UserLoginRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^1\d{10}$'
          example: '13800001111'
        code:
          type: string
          description: 课程固定验证码 1234
          example: '1234'

    UserLoginResult:
      type: object
      required: [token, expiresIn, user]
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          description: 令牌有效期（秒）
          example: 7200
        user:
          $ref: '#/components/schemas/UserBrief'

    UserBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserBrief'
        - type: object
          properties:
            addressCount:
              type: integer
            orderCount:
              type: integer

    EmployeeLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 32
        password:
          type: string
          maxLength: 32

    EmployeeLoginResult:
      type: object
      required: [token, expiresIn, employee]
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          example: 7200
        employee:
          $ref: '#/components/schemas/EmployeeBrief'

    EmployeeBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        phone:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: integer
          enum: [1, 2]
          description: 1 菜品分类，2 套餐分类
        name:
          type: string
        sort:
          type: integer
        status:
          type: integer
          enum: [0, 1]

    CategoryUpsert:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 16
        type:
          type: integer
          enum: [1, 2]
        sort:
          type: integer
          minimum: 0
          default: 0

    FlavorGroup:
      type: object
      properties:
        name:
          type: string
          description: 口味名，如 辣度
        values:
          type: array
          items:
            type: string

    Dish:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
          description: 列表展示用，后端联表返回
        price:
          type: string
          example: '18.00'
        image:
          type: string
          nullable: true
          description: 图片 URL；为空时前端显示占位图
        description:
          type: string
          nullable: true
        status:
          type: integer
          enum: [0, 1]
          description: 1 起售，0 停售
        updateTime:
          type: string
          nullable: true

    DishDetail:
      allOf:
        - $ref: '#/components/schemas/Dish'
        - type: object
          properties:
            flavors:
              type: array
              items:
                $ref: '#/components/schemas/FlavorGroup'

    DishUpsert:
      type: object
      required: [name, categoryId, price]
      properties:
        name:
          type: string
          maxLength: 40
        categoryId:
          type: integer
          format: int64
        price:
          type: string
          pattern: '^\d{1,7}(\.\d{1,2})?$'
          example: '18.00'
        image:
          type: string
        description:
          type: string
          maxLength: 120
        status:
          type: integer
          enum: [0, 1]
          default: 1

    SetmealDishItem:
      type: object
      properties:
        dishId:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: string
        copies:
          type: integer
          minimum: 1

    Setmeal:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        price:
          type: string
          example: '22.00'
        image:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: integer
          enum: [0, 1]
        dishes:
          type: array
          items:
            $ref: '#/components/schemas/SetmealDishItem'

    SetmealUpsert:
      type: object
      required: [name, categoryId, price]
      properties:
        name:
          type: string
        categoryId:
          type: integer
          format: int64
        price:
          type: string
        image:
          type: string
        description:
          type: string
        status:
          type: integer
          enum: [0, 1]
          default: 1
        dishes:
          type: array
          description: 套餐内菜品组合，至少一项
          items:
            $ref: '#/components/schemas/SetmealDishItem'

    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        image:
          type: string
          nullable: true

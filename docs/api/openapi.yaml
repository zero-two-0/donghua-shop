# 状态：组员第 1~3 周草案（已归档，勿作为依据）。组长权威契约见 docs/leader/week3/openapi.yaml；
# 整合结果见 docs/integration/contract-diff.md。

openapi: 3.0.3
info:
  title: 东华大学在线点餐系统 API
  version: 0.3.0-frozen-draft
  description: |
    用户端 H5 与商家管理 Web 共用的 REST 接口契约（第 3 周冻结稿，状态：待双方评审签字）。

    ## 通用约定
    - 基础路径：`/api`，例如 `GET /api/dishes`。前端 Vite 已将 `/api` 代理到 `http://127.0.0.1:8080`。
    - 请求与响应均为 `application/json; charset=utf-8`。
    - 统一响应外壳：`{ "code": 0, "message": "ok", "data": ... }`；成功时 `code = 0`，失败时 `data = null`。
    - 业务失败同时返回语义化 HTTP 状态码（400/401/403/404/409/500），前端拦截器对两者都做处理。
    - 鉴权：除两个登录接口外，`/api/user/**` 与 `/api/admin/**` 均需 `Authorization: Bearer <token>`；
      用户令牌与员工令牌不互通，用户令牌调用管理端接口返回 403。
    - 分页：请求参数 `page`（从 1 开始，默认 1）、`pageSize`（默认 10，最大 50）；
      响应 `data` 为 `{ page, pageSize, total, records }`。
    - 金额：字符串，保留两位小数，单位为元，例如 `"18.00"`；禁止用浮点数传输以免精度丢失。
    - 时间：字符串，格式 `yyyy-MM-dd HH:mm:ss`，时区固定东八区。
    - 状态枚举：菜品/套餐 `status` 1 起售、0 停售；订单 `status` 1 待付款、2 待接单、3 已接单、4 派送中、5 已完成、6 已取消；
      订单 `payStatus` 0 未支付、1 已支付、2 已退款。
    - 业务错误码：
      | code | 含义 |
      | --- | --- |
      | 40001 | 参数校验失败 |
      | 40101 | 未登录或令牌失效 |
      | 40102 | 验证码错误 |
      | 40103 | 用户名或密码错误 |
      | 40301 | 无访问权限（越权访问他人资源） |
      | 40302 | 账号已禁用 |
      | 40401 | 资源不存在 |
      | 40400 | 接口不存在 |
      | 40901 | 商品已停售 |
      | 40902 | 默认地址不可直接删除 |
      | 40903 | 购物车为空，无法下单 |
      | 40904 | 订单已支付，重复提交 |
      | 40905 | 订单已取消，无法支付 |
      | 40906 | 分类名称重复 |
      | 40907 | 分类下仍有商品，无法删除 |
      | 40908 | 商品被套餐引用，无法删除 |
      | 40909 | 订单状态迁移非法 |
      | 50000 | 服务器内部错误 |
    - 课程范围说明：用户登录使用“手机号 + 固定验证码 1234”模拟流程；支付只变更本地订单状态，
      不接入真实短信、支付与微信小程序能力。
servers:
  - url: http://127.0.0.1:8080/api
    description: 本机联调
  - url: /api
    description: 前端同域代理
tags:
  - name: 用户端-认证
    description: 用户登录与个人概要
  - name: 用户端-菜单
    description: 分类、菜品与套餐浏览
  - name: 用户端-购物车
    description: 购物车增删改查
  - name: 用户端-地址
    description: 收货地址维护
  - name: 用户端-订单
    description: 下单、模拟支付与查单
  - name: 管理端-认证
    description: 员工登录
  - name: 管理端-商品
    description: 分类、菜品、套餐管理
  - name: 管理端-订单
    description: 订单处理
  - name: 管理端-统计
    description: 营业概览

security:
  - bearerAuth: []

paths:
  # ============================ 用户端 ============================
  /user/auth/login:
    post:
      tags: [用户端-认证]
      summary: 用户登录（模拟验证码）
      description: 课程内不接入短信服务，验证码固定为 `1234`；首次登录按手机号自动注册。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            example:
              phone: '13800001111'
              code: '1234'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserLoginResult'
              example:
                code: 0
                message: ok
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.mock
                  expiresIn: 7200
                  user:
                    id: 1
                    name: 测试同学
                    phone: '13800001111'
                    avatar: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 验证码错误（40102）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/profile:
    get:
      tags: [用户端-认证]
      summary: 个人中心概要
      responses:
        '200':
          description: 用户概要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories:
    get:
      tags: [用户端-菜单]
      summary: 查询分类列表
      security: []
      parameters:
        - name: type
          in: query
          description: 1 菜品分类，2 套餐分类；不传返回全部
          schema:
            type: integer
            enum: [1, 2]
      responses:
        '200':
          description: 分类列表（按 sort 升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

  /dishes:
    get:
      tags: [用户端-菜单]
      summary: 分页查询在售菜品
      description: 仅返回 `status = 1` 的在售菜品；`keyword` 与 `categoryId` 同时传入时以 `keyword` 优先。
      security: []
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: keyword
          in: query
          description: 菜品名称模糊匹配，最长 32 字
          schema: { type: string, maxLength: 32 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 菜品分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/BadRequest'

  /dishes/{dishId}:
    get:
      tags: [用户端-菜单]
      summary: 菜品详情（含口味选项）
      security: []
      parameters:
        - $ref: '#/components/parameters/DishId'
      responses:
        '200':
          description: 菜品详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DishDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /setmeals:
    get:
      tags: [用户端-菜单]
      summary: 分页查询在售套餐
      security: []
      parameters:
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 套餐分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Setmeal'

  /user/cart:
    get:
      tags: [用户端-购物车]
      summary: 查询当前用户购物车
      responses:
        '200':
          description: 购物车条目（按加入时间升序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CartItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [用户端-购物车]
      summary: 清空当前用户购物车
      responses:
        '200':
          description: 已清空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/cart/items:
    post:
      tags: [用户端-购物车]
      summary: 加入购物车
      description: |
        同一商品（dishId 或 setmealId）且口味相同则累加数量；数量上限 99。
        `dishId` 与 `setmealId` 必须且只能传一个；停售商品返回 40901。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddRequest'
            example:
              dishId: 4
              number: 2
              dishFlavor: '辣度:微辣'
      responses:
        '200':
          description: 加入后的购物车条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 商品已停售（40901）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/cart/items/{itemId}:
    patch:
      tags: [用户端-购物车]
      summary: 修改购物车条目数量
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartUpdateRequest'
      responses:
        '200':
          description: 修改后的条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 条目不属于当前用户（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [用户端-购物车]
      summary: 删除购物车条目
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 条目不属于当前用户（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/addresses:
    get:
      tags: [用户端-地址]
      summary: 查询当前用户收货地址
      responses:
        '200':
          description: 地址列表（默认地址排最前）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [用户端-地址]
      summary: 新增收货地址
      description: 用户第一条地址自动设为默认；`isDefault = 1` 时后端需保证同一用户至多一条默认地址。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpsert'
      responses:
        '200':
          description: 新增的地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/addresses/{addressId}:
    put:
      tags: [用户端-地址]
      summary: 修改收货地址
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpsert'
      responses:
        '200':
          description: 修改后的地址
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 越权访问他人地址（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [用户端-地址]
      summary: 删除收货地址
      description: 默认地址且用户仍有其他地址时拒绝删除，返回 40902；无地址时允许删除。
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiOk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 越权访问他人地址（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 默认地址不可直接删除（40902）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/orders:
    post:
      tags: [用户端-订单]
      summary: 提交订单（未支付）
      description: |
        后端校验收货地址归属、购物车非空与商品在售状态，**金额一律由后端计算**，
        前端传任何金额都不采信。下单成功后订单状态为 1（待付款），购物车清空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSubmitRequest'
            example:
              addressBookId: 1
              remark: '不要香菜'
      responses:
        '200':
          description: 下单成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderSubmitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 购物车为空（40903）或商品已停售（40901）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [用户端-订单]
      summary: 分页查询当前用户订单
      parameters:
        - name: status
          in: query
          description: 订单状态筛选，不传为全部
          schema:
            type: integer
            enum: [1, 2, 3, 4, 5, 6]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 订单分页结果（按下单时间倒序）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/OrderSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/orders/{orderId}:
    get:
      tags: [用户端-订单]
      summary: 查询订单详情
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 订单详情（含明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 只能查看本人订单（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/orders/{orderId}/mock-payment:
    post:
      tags: [用户端-订单]
      summary: 模拟支付（课程内不接入真实支付）
      description: |
        幂等要求：已支付订单再次调用返回 40904；已取消订单返回 40905。
        支付成功后订单状态由 1 变为 2（待接单），并记录 `checkoutTime`。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 支付成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MockPaymentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 只能支付本人订单（40301）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 重复支付（40904）或订单已取消（40905）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================ 管理端 ============================
  /admin/auth/login:
    post:
      tags: [管理端-认证]
      summary: 员工登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeLoginRequest'
            example:
              username: admin
              password: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeLoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码错误（40103）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 账号已禁用（40302）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/auth/me:
    get:
      tags: [管理端-认证]
      summary: 当前登录员工信息
      responses:
        '200':
          description: 员工信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmployeeBrief'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/categories:
    get:
      tags: [管理端-商品]
      summary: 分页查询分类
      parameters:
        - name: type
          in: query
          schema: { type: integer, enum: [1, 2] }
        - name: name
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 分类分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiOk'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              records:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:

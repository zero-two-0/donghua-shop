      summary: 变更订单状态（接单/派送/完成/取消）
      description: |
        合法迁移：2→3 接单、3→4 派送、4→5 完成、2→6 拒单、1→6 取消。
        其他迁移返回 40909；迁移到 6 必须填写 `reason`。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusPatch'
            example:
              status: 3
      responses:
        '200':
          description: 变更后的订单状态
          content:

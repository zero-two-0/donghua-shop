          type: string
          nullable: true
        cityCode:
          type: string
          nullable: true
        cityName:
          type: string
          nullable: true
        districtCode:
          type: string
          nullable: true
        districtName:
          type: string
          nullable: true
        detail:
          type: string
        label:
